# 파일명이 SQL의 catalog 이름이 된다: iceberg.retail.orders
connector.name=iceberg
iceberg.catalog.type=hive_metastore
# Trino는 catalog-db에 직접 접속하지 않고 HMS API에서 현재 JSON 위치를 얻는다.
hive.metastore.uri=thrift://hms:9083
# 조회 전용: SeaTunnel이 관리하는 테이블을 Trino에서 수정하지 않는다.
iceberg.security=READ_ONLY
# Trino 483의 native local filesystem은 file: URI도 처리한다.
fs.local.enabled=true
# 이 값은 URI 접두사가 아니라 실제 파일시스템 루트(Path)다.
# 기존 file:/lake/...의 path가 lake/...이므로 루트 /와 합쳐 /lake/...로 읽는다.
# /lake로 지정하면 /lake/lake/...가 되어 기존 경로와 달라진다.
local.location=/
