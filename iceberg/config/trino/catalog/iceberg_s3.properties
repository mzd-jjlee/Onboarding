# MinIO(s3a://lakehouse/...)에 있는 Iceberg 테이블을 읽는 catalog: iceberg_s3.public_api_s3.weather_hourly
# 같은 HMS를 쓰므로 기존 테이블도 목록에는 보이지만, file:/lake 테이블은 기존 catalog "iceberg"로 조회한다.
connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://hms:9083
iceberg.security=READ_ONLY
# Trino 자체 S3 구현. s3://, s3a:// 경로를 모두 S3로 읽는다.
fs.native-s3.enabled=true
# 컨테이너 간 통신이므로 서비스 이름 minio. 로컬 MinIO는 path-style로 접속한다.
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
# 접속 키는 적지 않는다: 컨테이너 환경변수 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY(.env.minio)를 기본 자격증명 체인이 읽는다.
