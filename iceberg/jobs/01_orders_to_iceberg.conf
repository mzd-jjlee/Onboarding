env {
 parallelism = 1
 job.mode = "BATCH"
}
source {
 Jdbc {
  url = "jdbc:postgresql://source-db:5432/ordersdb"
  driver = "org.postgresql.Driver"
  user = "demo"
  password = "demo"
  query = "select order_id, customer_name, amount, status from orders where batch_id = 1"
 }
}
sink {
 # Iceberg 커넥터가 파일 작성과 HMS 등록·커밋을 함께 처리한다.
 Iceberg {
  # 이 작업 안에서 사용할 카탈로그 이름. HMS의 DB 이름과 같을 필요는 없다.
  catalog_name = "local_hive"
  iceberg.catalog.config = {
   # 테이블 관리 방식으로 Hive 카탈로그를 선택한다.
   type = "hive"
   # SeaTunnel → HMS의 Thrift API 주소. 등록·조회·갱신 요청을 이곳으로 보낸다.
   # HMS → PostgreSQL 연결은 compose.yaml의 SERVICE_OPTS에서 별도로 설정한다.
   uri = "thrift://hms:9083"
   # Iceberg 파일의 기본 저장 위치. 컨테이너 /lake는 호스트 ./lake에 연결된다.
   # 기존 테이블의 위치를 이 값만 바꿔서 이동할 수는 없다.
   warehouse = "file:///lake/warehouse"
  }
  # prepare_catalog.py가 미리 만드는 테이블 묶음. 대상 전체 이름은 retail.orders다.
  namespace = "retail"
  table = "orders"
  iceberg.table.write-props = {
   write.format.default = "parquet"
  }
  # 대상 테이블이 없으면 source 스키마를 바탕으로 생성한다.
  schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
  # 기존 데이터에 추가한다. 같은 배치를 재실행하면 행이 중복될 수 있다.
  data_save_mode = "APPEND_DATA"
 }
}