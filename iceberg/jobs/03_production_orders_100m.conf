# 기존 retail.orders와 독립된 대용량 실습 테이블. 재실행은 scripts/load-production-100m.py 사용.
env {
  parallelism = 4
  job.mode = "BATCH"
}
source {
  Jdbc {
    # Mac의 localhost:5440에 해당하는 컨테이너→호스트 주소.
    url = "jdbc:postgresql://host.docker.internal:5440/srcdb?ApplicationName=iceberg_bulk_100m&readOnly=true"
    driver = "org.postgresql.Driver"
    user = ${SOURCE_USER}
    password = ${SOURCE_PASSWORD}
    query = "select order_id, factory_id, product_name, quantity, order_date, status from public.production_orders_100m"
    plugin_output = "source_rows"
    fetch_size = 5000
    # query 기반 고정 분할: 기본키 범위를 4개로 나눠 병렬 조회한다.
    partition_column = "order_id"
    partition_num = 4
  }
}
# SQL projection은 컬럼명 목록으로 PK 유지 여부를 결정한다.
# 이름을 임시로 바꿨다가 복원해 데이터 값은 그대로 두고 원본 PK 메타데이터만 제거한다.
transform {
  Sql {
    plugin_input = "source_rows"
    plugin_output = "without_pk"
    query = "select order_id as ingest_order_id, factory_id, product_name, quantity, order_date, status from source_rows"
  }
  Sql {
    plugin_input = "without_pk"
    plugin_output = "append_rows"
    query = "select ingest_order_id as order_id, factory_id, product_name, quantity, order_date, status from without_pk"
  }
}
sink {
  Iceberg {
    plugin_input = "append_rows"
    catalog_name = "local_hive"
    iceberg.catalog.config = {
      type = "hive"
      uri = "thrift://hms:9083"
      warehouse = "file:///lake/warehouse"
    }
    # 원본 PK를 가져온 자동 생성 테이블은 Delta writer를 선택할 수 있다.
    # prepare-production-catalog.sh가 식별자 없는 append 테이블을 먼저 만든다.
    iceberg.table.upsert-mode-enabled = false
    namespace = "retail"
    table = "production_orders_100m"
    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.parquet.compression-codec = "zstd"
      write.target-file-size-bytes = 134217728
      write.parquet.row-group-size-bytes = 16777216
    }
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
