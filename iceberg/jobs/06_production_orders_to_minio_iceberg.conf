# 상세: tasks/003-production-orders-to-minio.md
# 반드시 scripts/load-production-orders-to-minio.py를 통해 실행: APPEND 자체는 중복을 막지 않는다.
# 대상 테이블(월별 파티션, PK 표시 없음)은 래퍼가 PrepareRetailS3Catalog.java로 먼저 만든다.
env {
  parallelism = 2
  job.mode = "BATCH"
}
source {
  Jdbc {
    # Mac의 localhost:5440(seatunnel 프로젝트의 원본 Postgres)에 해당하는 컨테이너→호스트 주소.
    url = "jdbc:postgresql://host.docker.internal:5440/srcdb?ApplicationName=iceberg_minio_2m&readOnly=true"
    driver = "org.postgresql.Driver"
    user = ${SOURCE_USER}
    password = ${SOURCE_PASSWORD}
    query = "select order_id, factory_id, product_name, quantity, order_date, status from public.production_orders"
    plugin_output = "source_rows"
    fetch_size = 5000
    # 기본키 범위를 2개로 나눠 병렬 조회한다.
    partition_column = "order_id"
    partition_num = 2
  }
}
# 이름을 임시로 바꿨다가 복원해 값과 컬럼은 그대로 두고 원본 PK 메타데이터만 제거한다 (03 job과 동일).
transform {
  Sql {
    plugin_input = "source_rows"
    plugin_output = "without_pk"
    query = "select order_id as ingest_order_id, factory_id, product_name, quantity, order_date, status from source_rows"
  }
  Sql {
    plugin_input = "without_pk"
    plugin_output = "append_rows"
    query = "select ingest_order_id as order_id, factory_id, product_name, quantity, order_date, status from without_pk"
  }
}
sink {
  Iceberg {
    plugin_input = "append_rows"
    catalog_name = "local_hive_s3"
    iceberg.catalog.config = {
      type = "hive"
      uri = "thrift://hms:9083"
      warehouse = "s3a://lakehouse/warehouse"
    }
    # Hadoop s3a 파일 IO 설정. 접속 키는 컨테이너 환경변수(AWS_ACCESS_KEY_ID 등, .env.minio)에서 읽는다.
    hadoop.config = {
      "fs.s3a.endpoint" = "http://minio:9000"
      "fs.s3a.endpoint.region" = "us-east-1"
      "fs.s3a.path.style.access" = "true"
      "fs.s3a.connection.ssl.enabled" = "false"
    }
    iceberg.table.upsert-mode-enabled = false
    namespace = "retail_s3"
    table = "production_orders"
    # 미리 만든 테이블에만 쓴다. 없으면 자동 생성하지 않고 실패한다.
    schema_save_mode = "ERROR_WHEN_SCHEMA_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
