# 상세: docs/minio-s3-lakehouse.md
# 반드시 scripts/load-weather-to-minio.py를 통해 실행: APPEND 자체는 중복을 막지 않는다.
env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  LocalFile {
    # load-weather-to-minio.py가 원본 snapshot에서 만든 CSV (호스트 ./data/minio-lab)
    path = "/minio-data/weather.csv"
    file_format_type = "csv"
    skip_header_row_number = 1
    parse_partition_from_path = false
    schema {
      fields {
        city = string
        weather_time = string
        temperature_2m = double
        relative_humidity_2m = int
        precipitation = double
      }
    }
  }
}
sink {
  Iceberg {
    catalog_name = "local_hive_s3"
    iceberg.catalog.config = {
      type = "hive"
      uri = "thrift://hms:9083"
      warehouse = "s3a://lakehouse/warehouse"
    }
    # Hadoop s3a 파일 IO 설정. 접속 키는 컨테이너 환경변수(AWS_ACCESS_KEY_ID 등, .env.minio)에서 읽는다.
    hadoop.config = {
      "fs.s3a.endpoint" = "http://minio:9000"
      "fs.s3a.endpoint.region" = "us-east-1"
      "fs.s3a.path.style.access" = "true"
      "fs.s3a.connection.ssl.enabled" = "false"
    }
    namespace = "public_api_s3"
    table = "weather_hourly"
    iceberg.table.write-props = {
      write.format.default = "parquet"
    }
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
