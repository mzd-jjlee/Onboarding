# task: tasks/001-public-api-to-iceberg.md
# 반드시 scripts/public_api_weather.py를 통해 실행: APPEND 자체는 중복을 막지 않는다.
env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  LocalFile {
    path = "/api-data/weather.csv"
    file_format_type = "csv"
    skip_header_row_number = 1
    parse_partition_from_path = false
    schema {
      fields {
        city = string
        weather_time = string
        temperature_2m = double
        relative_humidity_2m = int
        precipitation = double
      }
    }
  }
}
sink {
  Iceberg {
    catalog_name = "local_hive"
    iceberg.catalog.config = {
      type = "hive"
      uri = "thrift://hms:9083"
      warehouse = "file:///lake/warehouse"
    }
    namespace = "public_api"
    table = "weather_hourly"
    iceberg.table.write-props = {
      write.format.default = "parquet"
    }
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
