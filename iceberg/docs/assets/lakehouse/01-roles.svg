<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="01  ·  역할을 먼저 나누기">
<title>01  ·  역할을 먼저 나누기</title><desc>SQL은 DuckDB가 실행하고, Iceberg는 테이블을 구성하는 규칙을 제공한다.</desc>
<defs><marker id="arrow-01-roles" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68798a"/></marker></defs>
<rect width="1200" height="100%" rx="18" fill="#ffffff"/>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#203349} .title{font-size:27px;font-weight:700} .sub{font-size:18px;fill:#53677b} .node{font-size:21px;font-weight:700} .body{font-size:17px} .label{font-size:16px;fill:#53677b}</style>
<text x="35" y="44" class="title" text-anchor="start">01  ·  역할을 먼저 나누기</text>
<text x="35" y="76" class="sub" text-anchor="start">SQL은 DuckDB가 실행하고, Iceberg는 테이블을 구성하는 규칙을 제공한다.</text>
<rect x="35" y="125" width="235" height="106" rx="12" fill="#eaf2ff" stroke="#2963ba" stroke-width="1.5"/>
<text x="53" y="156" class="node" text-anchor="start">원본 DB</text>
<text x="53" y="185" class="body" text-anchor="start">업무 데이터</text>
<text x="53" y="209" class="body" text-anchor="start">PostgreSQL / MySQL</text>
<rect x="330" y="125" width="235" height="106" rx="12" fill="#eaf2ff" stroke="#2963ba" stroke-width="1.5"/>
<text x="348" y="156" class="node" text-anchor="start">SeaTunnel Zeta</text>
<text x="348" y="185" class="body" text-anchor="start">읽고 적재하는 엔진</text>
<text x="348" y="209" class="body" text-anchor="start">LocalFile / Iceberg sink</text>
<rect x="635" y="125" width="235" height="106" rx="12" fill="#e8f6ee" stroke="#26784c" stroke-width="1.5"/>
<text x="653" y="156" class="node" text-anchor="start">로컬 디스크</text>
<text x="653" y="185" class="body" text-anchor="start">실제 데이터: Parquet</text>
<text x="653" y="209" class="body" text-anchor="start">테이블 정보: JSON / Avro</text>
<rect x="930" y="125" width="235" height="106" rx="12" fill="#eaf2ff" stroke="#2963ba" stroke-width="1.5"/>
<text x="948" y="156" class="node" text-anchor="start">DuckDB</text>
<text x="948" y="185" class="body" text-anchor="start">SQL · 집계 · 조인</text>
<text x="948" y="209" class="body" text-anchor="start">파일을 읽어 결과 생성</text>
<polyline points="270,178 330,178" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-01-roles)"/>
<polyline points="565,178 635,178" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-01-roles)"/>
<polyline points="870,178 930,178" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-01-roles)"/>
<text x="900" y="164" class="label" text-anchor="middle">읽기</text>
<rect x="635" y="310" width="235" height="106" rx="12" fill="#f1edff" stroke="#7354ac" stroke-width="1.5"/>
<text x="653" y="341" class="node" text-anchor="start">Hive Metastore</text>
<text x="653" y="370" class="body" text-anchor="start">이름 → 현재 메타 위치</text>
<text x="653" y="394" class="body" text-anchor="start">카탈로그 서비스</text>
<rect x="35" y="310" width="530" height="106" rx="12" fill="#fff2df" stroke="#986014" stroke-width="1.5"/>
<text x="53" y="341" class="node" text-anchor="start">Iceberg = 테이블 포맷 + 구현</text>
<text x="53" y="370" class="body" text-anchor="start">별도 SQL 서버가 아니라, 파일 집합과 버전을 관리하는 규약</text>
<text x="53" y="394" class="body" text-anchor="start">writer와 reader 안의 라이브러리 / 확장이 처리한다</text>
<polyline points="1048,231 1048,365 870,365" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-01-roles)" stroke-dasharray="7 5"/>
<text x="1000" y="345" class="label" text-anchor="middle">테이블 찾기</text>
<text x="35" y="493" class="sub" text-anchor="start">※ 조회 경로에 따라 PyIceberg가 파일을 읽어 DuckDB에 넘길 수도 있다. 그림 06에서 구분한다.</text>
</svg>
