<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="03  ·  메타데이터는 어디에 저장될까?">
<title>03  ·  메타데이터는 어디에 저장될까?</title><desc>카탈로그 DB와 Iceberg 메타데이터 파일, 실제 행 데이터는 서로 다른 층이다.</desc>
<defs><marker id="arrow-03-metadata" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68798a"/></marker></defs>
<rect width="1200" height="100%" rx="18" fill="#ffffff"/>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#203349} .title{font-size:27px;font-weight:700} .sub{font-size:18px;fill:#53677b} .node{font-size:21px;font-weight:700} .body{font-size:17px} .label{font-size:16px;fill:#53677b}</style>
<text x="35" y="44" class="title" text-anchor="start">03  ·  메타데이터는 어디에 저장될까?</text>
<text x="35" y="76" class="sub" text-anchor="start">카탈로그 DB와 Iceberg 메타데이터 파일, 실제 행 데이터는 서로 다른 층이다.</text>
<rect x="35" y="120" width="1130" height="87" rx="12" fill="#f1edff" stroke="#7354ac" stroke-width="1.5"/>
<text x="53" y="151" class="node" text-anchor="start">HMS 백엔드 DB: 이름과 현재 위치</text>
<text x="53" y="180" class="body" text-anchor="start">retail.orders → metadata_location = file:///lake/.../00002-uuid.metadata.json</text>
<polyline points="200,207 200,254" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-03-metadata)"/>
<text x="375" y="239" class="label" text-anchor="middle">위치를 따라 파일 읽기</text>
<rect x="35" y="254" width="330" height="106" rx="12" fill="#fff2df" stroke="#986014" stroke-width="1.5"/>
<text x="53" y="285" class="node" text-anchor="start">metadata JSON</text>
<text x="53" y="314" class="body" text-anchor="start">테이블 스키마 · 파티션 정의</text>
<text x="53" y="338" class="body" text-anchor="start">현재 스냅샷 → S2</text>
<rect x="435" y="254" width="330" height="106" rx="12" fill="#fff2df" stroke="#986014" stroke-width="1.5"/>
<text x="453" y="285" class="node" text-anchor="start">manifest list</text>
<text x="453" y="314" class="body" text-anchor="start">S2에 포함되는</text>
<text x="453" y="338" class="body" text-anchor="start">manifest들의 목록</text>
<rect x="835" y="254" width="330" height="106" rx="12" fill="#fff2df" stroke="#986014" stroke-width="1.5"/>
<text x="853" y="285" class="node" text-anchor="start">manifest</text>
<text x="853" y="314" class="body" text-anchor="start">데이터 파일 경로</text>
<text x="853" y="338" class="body" text-anchor="start">파티션 값 · 통계</text>
<polyline points="365,307 435,307" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-03-metadata)"/>
<polyline points="765,307 835,307" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-03-metadata)"/>
<rect x="835" y="415" width="330" height="88" rx="12" fill="#e8f6ee" stroke="#26784c" stroke-width="1.5"/>
<text x="853" y="446" class="node" text-anchor="start">Parquet</text>
<text x="853" y="475" class="body" text-anchor="start">실제 행: 1001, DONE, ...</text>
<polyline points="1000,360 1000,415" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-03-metadata)"/>
<text x="35" y="440" class="sub" text-anchor="start">JSON과 Avro는 warehouse 등의 파일 저장소에 있다.</text>
<text x="35" y="474" class="sub" text-anchor="start">HMS의 PostgreSQL에 Parquet 행을 적재하는 것이 아니다.</text>
</svg>
