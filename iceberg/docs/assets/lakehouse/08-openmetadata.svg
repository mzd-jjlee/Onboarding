<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="08  ·  OpenMetadata는 사람이 이해하는 계층">
<title>08  ·  OpenMetadata는 사람이 이해하는 계층</title><desc>HMS는 실행을 위한 카탈로그이고, OpenMetadata는 검색·설명·소유자·계보를 위한 서비스다.</desc>
<defs><marker id="arrow-08-openmetadata" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68798a"/></marker></defs>
<rect width="1200" height="100%" rx="18" fill="#ffffff"/>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#203349} .title{font-size:27px;font-weight:700} .sub{font-size:18px;fill:#53677b} .node{font-size:21px;font-weight:700} .body{font-size:17px} .label{font-size:16px;fill:#53677b}</style>
<text x="35" y="44" class="title" text-anchor="start">08  ·  OpenMetadata는 사람이 이해하는 계층</text>
<text x="35" y="76" class="sub" text-anchor="start">HMS는 실행을 위한 카탈로그이고, OpenMetadata는 검색·설명·소유자·계보를 위한 서비스다.</text>
<rect x="35" y="130" width="340" height="106" rx="12" fill="#eaf2ff" stroke="#2963ba" stroke-width="1.5"/>
<text x="53" y="161" class="node" text-anchor="start">사람 / 데이터 사용자</text>
<text x="53" y="190" class="body" text-anchor="start">어떤 테이블인가?</text>
<text x="53" y="214" class="body" text-anchor="start">누가 관리하고 어디서 왔나?</text>
<rect x="465" y="130" width="700" height="106" rx="12" fill="#fff2df" stroke="#986014" stroke-width="1.5"/>
<text x="483" y="161" class="node" text-anchor="start">OpenMetadata</text>
<text x="483" y="190" class="body" text-anchor="start">메타데이터 수집 → 검색 / 설명 / 계보</text>
<text x="483" y="214" class="body" text-anchor="start">커넥터 설정과 수집 작업이 별도로 필요</text>
<polyline points="375,183 465,183" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-08-openmetadata)"/>
<rect x="35" y="325" width="340" height="106" rx="12" fill="#eaf2ff" stroke="#2963ba" stroke-width="1.5"/>
<text x="53" y="356" class="node" text-anchor="start">writer / reader</text>
<text x="53" y="385" class="body" text-anchor="start">테이블 로드와 커밋</text>
<text x="53" y="409" class="body" text-anchor="start">파일 읽기·쓰기</text>
<rect x="465" y="325" width="310" height="106" rx="12" fill="#f1edff" stroke="#7354ac" stroke-width="1.5"/>
<text x="483" y="356" class="node" text-anchor="start">Hive Metastore</text>
<text x="483" y="385" class="body" text-anchor="start">현재 테이블 위치</text>
<text x="483" y="409" class="body" text-anchor="start">커밋 상태 관리</text>
<rect x="855" y="325" width="310" height="106" rx="12" fill="#e8f6ee" stroke="#26784c" stroke-width="1.5"/>
<text x="873" y="356" class="node" text-anchor="start">파일 저장소</text>
<text x="873" y="385" class="body" text-anchor="start">metadata / manifest</text>
<text x="873" y="409" class="body" text-anchor="start">Parquet 데이터</text>
<polyline points="375,378 465,378" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-08-openmetadata)" stroke-dasharray="7 5"/>
<polyline points="205,431 205,463 1010,463 1010,431" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-08-openmetadata)"/>
<polyline points="620,325 620,236" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-08-openmetadata)" stroke-dasharray="7 5"/>
<text x="730" y="285" class="label" text-anchor="middle">별도 수집 구성</text>
</svg>
