<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="02  ·  파일 적재에 테이블 관리를 더하기">
<title>02  ·  파일 적재에 테이블 관리를 더하기</title><desc>같은 Parquet 파일이어도, 등록과 커밋 여부에 따라 Iceberg 테이블 포함 여부가 달라진다.</desc>
<defs><marker id="arrow-02-before-after" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68798a"/></marker></defs>
<rect width="1200" height="100%" rx="18" fill="#ffffff"/>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#203349} .title{font-size:27px;font-weight:700} .sub{font-size:18px;fill:#53677b} .node{font-size:21px;font-weight:700} .body{font-size:17px} .label{font-size:16px;fill:#53677b}</style>
<text x="35" y="44" class="title" text-anchor="start">02  ·  파일 적재에 테이블 관리를 더하기</text>
<text x="35" y="76" class="sub" text-anchor="start">같은 Parquet 파일이어도, 등록과 커밋 여부에 따라 Iceberg 테이블 포함 여부가 달라진다.</text>
<rect x="35" y="125" width="230" height="106" rx="12" fill="#f0f3f6" stroke="#566779" stroke-width="1.5"/>
<text x="53" y="156" class="node" text-anchor="start">지금까지</text>
<text x="53" y="185" class="body" text-anchor="start">DB → SeaTunnel</text>
<text x="53" y="209" class="body" text-anchor="start">파일을 완성한다</text>
<rect x="330" y="125" width="350" height="106" rx="12" fill="#e8f6ee" stroke="#26784c" stroke-width="1.5"/>
<text x="348" y="156" class="node" text-anchor="start">Parquet 파일들</text>
<text x="348" y="185" class="body" text-anchor="start">a.parquet / b.parquet</text>
<text x="348" y="209" class="body" text-anchor="start">폴더의 파일을 직접 조회</text>
<rect x="765" y="125" width="395" height="106" rx="12" fill="#eaf2ff" stroke="#2963ba" stroke-width="1.5"/>
<text x="783" y="156" class="node" text-anchor="start">DuckDB read_parquet()</text>
<text x="783" y="185" class="body" text-anchor="start">파일 경로로 SQL 실행</text>
<text x="783" y="209" class="body" text-anchor="start">Iceberg가 없어도 가능</text>
<polyline points="265,178 330,178" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-02-before-after)"/>
<polyline points="680,178 765,178" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-02-before-after)"/>
<rect x="35" y="310" width="230" height="106" rx="12" fill="#fff2df" stroke="#986014" stroke-width="1.5"/>
<text x="53" y="341" class="node" text-anchor="start">이번에 추가</text>
<text x="53" y="370" class="body" text-anchor="start">PyIceberg 등록</text>
<text x="53" y="394" class="body" text-anchor="start">새 상태를 커밋</text>
<rect x="330" y="310" width="350" height="106" rx="12" fill="#e8f6ee" stroke="#26784c" stroke-width="1.5"/>
<text x="348" y="341" class="node" text-anchor="start">Iceberg 스냅샷</text>
<text x="348" y="370" class="body" text-anchor="start">이 버전의 파일은 a + b</text>
<text x="348" y="394" class="body" text-anchor="start">파일 목록 · 스키마 · 이력</text>
<rect x="765" y="310" width="395" height="106" rx="12" fill="#f1edff" stroke="#7354ac" stroke-width="1.5"/>
<text x="783" y="341" class="node" text-anchor="start">카탈로그를 통한 테이블 탐색</text>
<text x="783" y="370" class="body" text-anchor="start">retail.orders → 현재 metadata</text>
<text x="783" y="394" class="body" text-anchor="start">선택된 스냅샷의 파일만 조회</text>
<polyline points="265,363 330,363" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-02-before-after)"/>
<polyline points="765,363 680,363" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-02-before-after)"/>
</svg>
