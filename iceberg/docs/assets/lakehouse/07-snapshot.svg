<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="07  ·  커밋이 바꾸는 것은 “현재 상태”">
<title>07  ·  커밋이 바꾸는 것은 “현재 상태”</title><desc>append 예시 · 스냅샷은 데이터 전체를 복제한 백업이 아니라 파일 집합을 가리키는 상태다.</desc>
<defs><marker id="arrow-07-snapshot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68798a"/></marker></defs>
<rect width="1200" height="100%" rx="18" fill="#ffffff"/>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#203349} .title{font-size:27px;font-weight:700} .sub{font-size:18px;fill:#53677b} .node{font-size:21px;font-weight:700} .body{font-size:17px} .label{font-size:16px;fill:#53677b}</style>
<text x="35" y="44" class="title" text-anchor="start">07  ·  커밋이 바꾸는 것은 “현재 상태”</text>
<text x="35" y="76" class="sub" text-anchor="start">append 예시 · 스냅샷은 데이터 전체를 복제한 백업이 아니라 파일 집합을 가리키는 상태다.</text>
<rect x="35" y="130" width="330" height="106" rx="12" fill="#f1edff" stroke="#7354ac" stroke-width="1.5"/>
<text x="53" y="161" class="node" text-anchor="start">커밋 전</text>
<text x="53" y="190" class="body" text-anchor="start">카탈로그 → S1의 metadata</text>
<text x="53" y="214" class="body" text-anchor="start">reader 결과 = a.parquet</text>
<rect x="435" y="130" width="330" height="106" rx="12" fill="#fff2df" stroke="#986014" stroke-width="1.5"/>
<text x="453" y="161" class="node" text-anchor="start">writer 준비 중</text>
<text x="453" y="190" class="body" text-anchor="start">b.parquet + 새 metadata</text>
<text x="453" y="214" class="body" text-anchor="start">아직 새 상태로 공개되지 않음</text>
<rect x="835" y="130" width="330" height="106" rx="12" fill="#f1edff" stroke="#7354ac" stroke-width="1.5"/>
<text x="853" y="161" class="node" text-anchor="start">커밋 후</text>
<text x="853" y="190" class="body" text-anchor="start">카탈로그 → S2의 metadata</text>
<text x="853" y="214" class="body" text-anchor="start">새 reader 결과 = a + b</text>
<polyline points="365,183 435,183" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-07-snapshot)"/>
<polyline points="765,183 835,183" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-07-snapshot)"/>
<rect x="35" y="330" width="530" height="106" rx="12" fill="#e8f6ee" stroke="#26784c" stroke-width="1.5"/>
<text x="53" y="361" class="node" text-anchor="start">S1 · 이전 상태</text>
<text x="53" y="390" class="body" text-anchor="start">a.parquet</text>
<text x="53" y="414" class="body" text-anchor="start">보존된 스냅샷으로 과거 조회 가능</text>
<rect x="635" y="330" width="530" height="106" rx="12" fill="#e8f6ee" stroke="#26784c" stroke-width="1.5"/>
<text x="653" y="361" class="node" text-anchor="start">S2 · 새 상태</text>
<text x="653" y="390" class="body" text-anchor="start">a.parquet + b.parquet</text>
<text x="653" y="414" class="body" text-anchor="start">a는 공유한다. 모든 데이터를 복사하지 않는다.</text>
<polyline points="200,236 200,330" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-07-snapshot)"/>
<polyline points="1000,236 1000,330" fill="none" stroke="#68798a" stroke-width="2.2" marker-end="url(#arrow-07-snapshot)"/>
<text x="35" y="482" class="sub" text-anchor="start">스냅샷을 만료하고 관련 파일을 삭제하면 그 시점의 과거 조회는 더 이상 보장되지 않는다.</text>
</svg>
