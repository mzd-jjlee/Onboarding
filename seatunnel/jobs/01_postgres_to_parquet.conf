env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders"
    fetch_size = 5000   # 200만 행을 한 번에 메모리로 안 끌어오고 서버 커서로 스트리밍
    plugin_output = "production_orders"
  }
}

transform {
  # Source와 Sink 사이에서 product_name을 대문자로 변환한다.
  # 나머지 컬럼은 원래 이름과 값을 그대로 전달한다.
  Sql {
    plugin_input = "production_orders"
    plugin_output = "production_orders_upper"
    query = "SELECT order_id, factory_id, product_name, quantity, order_date, status FROM production_orders"
  }
}

sink {
  LocalFile {
    plugin_input = "production_orders_upper"
    path = "/output/production_orders"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}
