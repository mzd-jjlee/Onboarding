# 2억 행 배치: 작업 배치는 스케줄러가 결정하며 노드별 균등 분배를 보장하지 않습니다.
env {
  parallelism = 8         # 병렬 처리 작업 수
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders_200m"
    
    partition_column = "order_id"
    partition_lower_bound = 1
    partition_upper_bound = 200000000
    partition_num = 8         #   db에서 읽을 범위의 조각 수
    
    fetch_size = 5000        # JDBC가 한번에 가져오는 행 수
    plugin_output = "production_orders_200m"
  }
}

sink {
  LocalFile {
    plugin_input = "production_orders_200m"
    path = "/output/production_orders_200m"
    # 모든 노드가 같은 호스트 output을 마운트하므로 임시 파일도 공유됩니다.
    tmp_path = "/output/.seatunnel-staging"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}
