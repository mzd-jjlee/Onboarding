# Postgres CDC(cdc_demo_orders 변경분) -> 같은 Postgres의 다른 테이블(cdc_demo_orders_replica)로 실시간 반영.
# 15번(Parquet 변경 후 값 누적 저장)과 대조되는 DB 변경 반영 데모.
# sink가 Jdbc라서 RowKind에 따라 INSERT/UPDATE/DELETE가 실제로 실행된다
# (InsertOrUpdateBatchStatementExecutor / BufferReducedBatchStatementExecutor로 코드 검증 완료).

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  Postgres-CDC {
    plugin_output = "cdc_demo_orders_cdc"
    username = "demo"
    password = "demo"
    database-names = ["srcdb"]
    schema-names = ["public"]
    table-names = ["srcdb.public.cdc_demo_orders"]
    url = "jdbc:postgresql://postgres:5432/srcdb?loggerLevel=OFF"
    decoding.plugin.name = "pgoutput"
    startup.mode = "initial"
    slot.name = "seatunnel_cdc_dbsink_demo"
  }
}

sink {
  Jdbc {
    plugin_input = "cdc_demo_orders_cdc"
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    generate_sink_sql = true
    database = "srcdb"
    table = "public.cdc_demo_orders_replica"
    primary_keys = ["order_id"]
  }
}
