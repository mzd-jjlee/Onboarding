# 시작 이후 INSERT/UPDATE_AFTER만 누적. 기존 행 스냅샷 및 DELETE/UPDATE_BEFORE 제외.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  Postgres-CDC {
    plugin_output = "cdc_demo_orders_cdc"
    username = "demo"
    password = "demo"
    database-names = ["srcdb"]
    schema-names = ["public"]
    table-names = ["srcdb.public.cdc_demo_orders"]
    url = "jdbc:postgresql://postgres:5432/srcdb?loggerLevel=OFF"
    decoding.plugin.name = "pgoutput"            ## 변경 메시지를 출력할 플러그인 이름
    startup.mode = "latest"
    slot.name = "seatunnel_cdc_10m_iu_test"      ## 사용할 진행 위치 관리 기록의 이름
  }
}

transform {
  # Source가 감지한 변경 종류를 cdc_op 컬럼으로 추가한다.
  # 예: INSERT(신규), UPDATE_BEFORE(수정 전), UPDATE_AFTER(수정 후), DELETE(삭제).
  RowKindExtractor {
    plugin_input = "cdc_demo_orders_cdc"
    plugin_output = "cdc_orders_with_op"
    custom_field_name = "cdc_op"
    transform_type = "FULL"
  }
  # 신규 행과 수정 후 행만 저장한다. 수정 전 행과 삭제 이벤트는 제외한다.
  # SELECT *이므로 cdc_op도 Parquet에 저장되며, 같은 PK의 변경도 이력으로 누적된다.
  Sql {
    plugin_input = "cdc_orders_with_op"
    plugin_output = "cdc_orders_insert_update"
    query = "SELECT * FROM cdc_orders_with_op WHERE cdc_op IN ('INSERT', 'UPDATE_AFTER')"
  }
}

sink {
  LocalFile {
    plugin_input = "cdc_orders_insert_update"
    path = "/output/cdc_10m_insert_update"
    tmp_path = "/output/.seatunnel-staging"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}
