# HDFS로 적재하는 예시 (미검증 — 공식 문서 기반 템플릿, jobs/sink-examples/README.md 참고)
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders"
    fetch_size = 5000
    plugin_output = "production_orders"
  }
}

sink {
  HdfsFile {
    plugin_input = "production_orders"
    fs.defaultFS = "hdfs://<namenode-host>:9000"
    path = "/warehouse/production_orders"
    tmp_path = "/tmp/seatunnel"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}

# Kerberos 인증이 필요한 클러스터라면 아래 옵션 추가:
#   kerberos_principal = "<principal>@<REALM>"
#   kerberos_keytab_path = "/path/to/keytab"
