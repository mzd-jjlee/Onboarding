# AWS S3로 적재하는 예시 (미검증 — 공식 문서 기반 템플릿, jobs/sink-examples/README.md 참고)
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders"
    fetch_size = 5000
    plugin_output = "production_orders"
  }
}

sink {
  S3File {
    plugin_input = "production_orders"
    path = "/seatunnel/production_orders"
    bucket = "s3a://<your-bucket>"
    fs.s3a.endpoint = "s3.ap-northeast-2.amazonaws.com"   # 리전에 맞게 변경
    fs.s3a.aws.credentials.provider = "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
    access_key = "<AWS_ACCESS_KEY>"
    secret_key = "<AWS_SECRET_KEY>"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}

# IAM 역할 기반으로 붙일 경우 access_key/secret_key 대신 아래로 대체:
#   fs.s3a.aws.credentials.provider = "com.amazonaws.auth.InstanceProfileCredentialsProvider"
