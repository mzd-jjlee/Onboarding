# Kafka로 흘려보내는 예시 (미검증 — 공식 문서 기반 템플릿, jobs/sink-examples/README.md 참고)
# 파일/DB가 아니라 메시지 큐로 보내는 사례 — 배치가 아니라 스트리밍/실시간 파이프라인의 다음 단계로
# 넘길 때 흔히 쓰는 패턴 (예: CDC로 잡은 변경분을 Kafka로 흘려서 여러 소비자가 구독하게 하는 구조).
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders"
    fetch_size = 5000
    plugin_output = "production_orders"
  }
}

sink {
  kafka {
    plugin_input = "production_orders"
    topic = "production-orders"
    bootstrap.servers = "<kafka-broker-host>:9092"
    format = "json"
    semantics = "EXACTLY_ONCE"
  }
}
