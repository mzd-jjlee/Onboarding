# MinIO(S3 호환 스토리지)로 적재하는 예시 (미검증 — 공식 문서 기반 템플릿, jobs/sink-examples/README.md 참고)
# S3File 커넥터를 그대로 쓰고, fs.s3a.endpoint만 MinIO 서버 주소로 바꾸면 된다.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders"
    fetch_size = 5000
    plugin_output = "production_orders"
  }
}

sink {
  S3File {
    plugin_input = "production_orders"
    path = "/seatunnel/production_orders"
    bucket = "s3a://<your-minio-bucket>"
    fs.s3a.endpoint = "http://<minio-host>:9000"   # ← AWS와 다른 유일한 핵심 차이
    fs.s3a.aws.credentials.provider = "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
    access_key = "minioadmin"
    secret_key = "minioadmin"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}
