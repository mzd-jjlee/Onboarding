env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders_100m"
    fetch_size = 5000   # 1억 행을 한 번에 메모리에 올리지 않고 서버 커서로 나눠 읽기
    plugin_output = "production_orders_100m"
  }
}

sink {
  LocalFile {
    plugin_input = "production_orders_100m"
    path = "/output/production_orders_100m"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}
