# 1억 행 02 설정과 동일한 병렬도·fetch 크기로 2억 행 Local 실행 비교.
# 실행: bash scripts/run-job.sh jobs/02_postgres_to_parquet_200m_local.conf
# Local 모드와 힙(초기 1GiB / 최대 3GiB)은 run-job.sh에서 적용한다.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/srcdb"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo"
    query = "select order_id, factory_id, product_name, quantity, order_date, status from production_orders_200m"
    fetch_size = 5000
    plugin_output = "production_orders_200m"
  }
}

sink {
  LocalFile {
    plugin_input = "production_orders_200m"
    # 기존 1억 행 및 2억 행 클러스터 결과와 분리한다.
    path = "/output/production_orders_200m_local"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}
