# MySQL JDBC → Parquet 배치 실험 (초기 시드 기준 production_orders 200만 행).
# 실행: bash scripts/run-job.sh jobs/01_mysql_to_parquet.conf
# 전제: MySQL이 seatunnel_default 네트워크에 있고 실행 이미지에 MySQL Connector/J가 있어야 한다.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    # mysql은 Docker Compose 서비스명이다. 아래 인증 옵션은 로컬 실습용이다.
    # useCursorFetch=true와 양수 fetch_size로 결과를 나눠 가져온다.
    url = "jdbc:mysql://mysql:3306/srcdb?useCursorFetch=true&useSSL=false&allowPublicKeyRetrieval=true"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "demo"
    password = "demo"
    query = "select * from production_orders"
    fetch_size = 5000
    plugin_output = "mysql_production_orders"
  }
}

# 변환 없이 Source의 여섯 컬럼을 Parquet에 그대로 저장한다.
sink {
  LocalFile {
    plugin_input = "mysql_production_orders"
    # PostgreSQL 결과와 섞이지 않도록 별도 경로를 사용한다.
    path = "/output/mysql_production_orders"
    file_format_type = "parquet"
    compress_codec = "snappy"
  }
}
