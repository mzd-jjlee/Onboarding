# Docker / Compose 읽기 안내서 (2026-10-13)
# 실행용 compose 파일이 아닌 학습 문서다. docker compose -f로 실행하지 않는다.
# 아래 example의 경로는 개념 설명용이며, 실제 프로젝트 기준 경로와 다르다.

reading_order:
  - "개념: image → container → volume → network"
  - "명령: build / up / run / exec / stop / down"
  - "구성: compose_example의 주석을 위에서 아래로 읽기"
  - "실제 적용: iceberg_restart와 iceberg_initial_setup 비교"

concepts:
  image: "프로그램과 실행 환경을 담은 템플릿. 다운로드(pull)하거나 Dockerfile로 빌드한다."
  container: "이미지로 만든 실행 인스턴스. 이미지를 만드는 것과 컨테이너 실행은 별개다."
  service: "Compose에서 컨테이너 실행 방법에 붙인 이름. 예: hms, catalog-tools."
  compose: "여러 서비스와 네트워크·볼륨을 YAML로 정의하고 함께 관리하는 도구."
  dockerfile: "이미지를 만드는 지시서. FROM은 기반 이미지, RUN은 빌드 작업, CMD는 기본 실행 명령."
  project: "Compose가 리소스를 묶는 단위. 이름이 달라지면 다른 볼륨·네트워크가 만들어질 수 있다."
  bind_mount: "./lake:/lake처럼 호스트의 특정 폴더를 컨테이너에 연결한다."
  named_volume: "catalog-db:/var/lib/postgresql/data처럼 Docker가 관리하는 영구 저장소를 연결한다."
  mac_storage: "Docker Desktop의 named volume은 Linux VM 안에 관리된다. 프로젝트 폴더에 DB 파일이 보이는 구조가 아니다."
  persistence: "컨테이너를 삭제해도 bind mount의 호스트 파일과 보존한 named volume은 남는다."

commands:
  # <service>는 실제 서비스 이름으로 바꾼다. 일반 예시는 해당 프로젝트 폴더에서 실행한다.
  pull:
    example: "docker compose pull <service>"
    meaning: "레지스트리에서 이미지를 받는다. 컨테이너를 실행하지 않는다."
  build:
    example: "docker compose build catalog-tools"
    meaning: "서비스의 build 설정이 가리키는 Dockerfile로 이미지를 만든다. 컨테이너 실행은 하지 않는다."
  up:
    example: "docker compose up -d --wait"
    meaning: "서비스를 생성·기동한다. 설정·이미지 변경이 있으면 기존 컨테이너를 재생성할 수 있다."
    detach: "-d는 터미널을 점유하지 않고 백그라운드 실행."
    wait: "--wait는 healthcheck가 있으면 healthy, 없으면 running까지 기다린다. 업무 전체의 정상 동작까지 보장하지는 않는다."
    selected_service: "끝에 superset을 붙이면 해당 서비스와 필요한 의존 서비스가 대상이다."
  build_and_up:
    example: "docker compose up -d --build <service>"
    meaning: "서비스를 빌드한 뒤 기동한다. Dockerfile을 수정한 경우 사용할 수 있다."
  run:
    example: "docker compose run --rm --no-deps catalog-tools python scripts/prepare_catalog.py"
    meaning: "서비스 설정으로 별도 작업 컨테이너를 만들고 지정한 명령을 실행한다."
    remove: "--rm은 작업 종료 후 이 컨테이너를 제거한다. 기존 DB 서비스의 named volume을 삭제하는 옵션이 아니다."
    no_deps: "--no-deps는 의존 서비스의 자동 기동을 생략한다. 필요한 서버는 먼저 준비해야 한다."
    ports: "run은 기본적으로 서비스의 ports를 공개하지 않는다. 필요하면 --service-ports 사용."
  exec:
    example: "docker compose exec -T catalog-db psql -U hive -d metastore -c 'SELECT 1'"
    meaning: "이미 실행 중인 컨테이너 안에서 명령 실행. 새 작업 컨테이너를 만들지 않는다."
    no_tty: "-T는 가상 터미널 할당을 끈다. 스크립트나 파이프로 실행할 때 사용한다."
  inspect:
    examples:
      - "docker compose ps"
      - "docker compose ps -a"
      - "docker compose logs --tail 100 hms"
      - "docker compose logs -f hms"
      - "docker stats"
      - "docker volume ls"
    meaning: "실행 상태·종료된 컨테이너·로그·CPU/메모리·볼륨 확인. logs -f는 계속 출력하며 Ctrl+C로 보기 종료."
  config:
    example: "docker compose -f compose.yaml -f compose.analytics.yaml config --quiet"
    meaning: "합쳐진 Compose 설정의 유효성을 검사한다. 서비스는 기동하지 않는다. --quiet 없이 출력하면 치환된 비밀번호 등이 보일 수 있다."
  stop_start:
    examples: ["docker compose stop", "docker compose start"]
    meaning: "기존 컨테이너를 정지·다시 시작한다. YAML 변경을 반영해 재생성하려면 up을 사용한다."
  restart:
    example: "docker compose restart <service>"
    meaning: "기존 컨테이너 재시작. 변경한 Compose 환경변수나 마운트 정의는 적용하지 않는다."
  down:
    example: "docker compose down"
    meaning: "컨테이너와 프로젝트 네트워크 등을 제거한다. 기본적으로 named volume과 이미지는 남긴다."
    volume_option: "down -v는 선언된 named volume과 연결된 anonymous volume까지 제거한다. DB 데이터를 보존할 때 붙이지 않는다. 외부(external) 볼륨은 제외된다."

# 실제 Compose 문법을 예시로 담았다. 이 안내 파일 자체는 실행용이 아니다.
compose_example:
  name: learning-example  # 프로젝트 이름: 실제 iceberg 스택과 다른 설명용 이름
  services:
    db:
      image: postgres:16  # 이미지 이름:태그. 가능하면 버전을 명시한다.
      environment:  # 컨테이너 프로세스에 전달하는 환경변수
        POSTGRES_USER: demo
        POSTGRES_DB: demo
        POSTGRES_PASSWORD: "<학습용 자리표시자>"
      ports:
        - "127.0.0.1:15432:5432"  # 호스트 주소:호스트 포트:컨테이너 포트
      volumes:
        - db-data:/var/lib/postgresql/data  # Docker가 관리하는 named volume
      healthcheck:  # 프로세스 실행 여부보다 구체적인 준비 상태 검사
        test: [CMD-SHELL, "pg_isready -U demo -d demo"]
        interval: 5s  # 검사 간격
        timeout: 3s   # 검사 1회 제한 시간
        retries: 20   # 연속 실패 허용 기준
        start_period: 20s  # 초기 기동 시 실패 유예 기간
      restart: unless-stopped  # 사용자가 정지한 경우를 제외하고 재시작하는 정책
    worker:
      build:
        context: .  # 빌드에 전달할 파일 범위. .dockerignore로 제외 가능
        dockerfile: config/Dockerfile.worker  # context 기준 Dockerfile 경로 (설명용)
      working_dir: /app  # 컨테이너 안에서 명령을 실행할 기준 폴더
      entrypoint: [python]  # 실행 프로그램. 이미지의 기본 ENTRYPOINT를 덮어쓴다.
      command: [scripts/task.py]  # 위 entrypoint에 전달할 인자 → python scripts/task.py
      # entrypoint를 명시하면 이미지의 기본 CMD에 자동으로 의존하지 않는다.
      # command만 바꾸면 이미지의 기존 ENTRYPOINT에 인자로 전달된다.
      volumes:
        - ./scripts:/app/scripts:ro  # 호스트 scripts 폴더 → 컨테이너 /app/scripts, 읽기 전용
        - ./output:/app/output      # :ro 없으면 기본적으로 쓰기 가능
      env_file:
        - .env.worker  # 컨테이너에 전달할 환경변수 파일. 예시 경로
      environment:
        DB_HOST: db  # 같은 Compose 네트워크에서는 서비스 이름으로 접속
        DB_PORT: "5432"  # 컨테이너끼리는 호스트 공개 포트 15432를 쓰지 않는다.
      depends_on:
        db:
          condition: service_healthy  # db의 healthcheck 통과 후 시작
      profiles: [tools]  # 기본 up에서 제외. 서비스를 명시하거나 프로필 활성화 시 사용
      mem_limit: 1g  # 컨테이너 메모리 한도. JVM -Xmx와는 별도 설정
  volumes:
    db-data: {}  # named volume 정의. 실제 연결은 각 서비스 volumes에서 지정
  networks:
    default: {}  # 기본 네트워크에서 서비스 이름으로 통신 가능

common_questions:
  localhost: "컨테이너 안의 localhost는 그 컨테이너 자신이다. Mac의 서버는 Docker Desktop에서 host.docker.internal로 접속한다."
  depends_on: "service_started는 컨테이너 시작, service_healthy는 healthcheck 성공을 기다린다. 실행 중 의존 서버 장애를 자동 복구해주는 기능은 아니다."
  env_files: "프로젝트 .env는 Compose의 ${VAR} 치환에 사용된다. 서비스 env_file은 컨테이너에 환경변수를 전달한다. 역할이 다르다."
  paths: "여러 -f 파일을 합칠 때 일반적으로 첫 Compose 파일의 폴더가 상대 경로 기준이다. Dockerfile 경로는 build context 기준이다."
  multiple_files: "-f compose.yaml -f compose.analytics.yaml은 두 독립 스택을 켜는 것이 아니라 설정을 병합한다. 뒤 파일의 설정이 병합·덮어쓰기 규칙에 따라 반영된다."
  profiles: "프로필 서비스 이름을 run/up에 직접 지정하면 해당 서비스를 실행할 수 있다. 같은 프로필의 다른 서비스가 모두 실행되는 것은 아니다."
  fresh_db: "PostgreSQL 공식 이미지의 docker-entrypoint-initdb.d 스크립트는 데이터 디렉터리가 비어 있을 때 초기화에 사용된다. 매 재시작 때 실행되지 않는다."
  shell_options: "set -e는 일반적인 명령 실패 시 중단(조건식 등 예외 있음), -u는 미설정 변수 참조 오류, pipefail은 파이프 중간 실패도 전체 실패로 반영. 자동 롤백은 아니다."

iceberg_initial_setup:
  working_directory: /Users/mz01-jaejunlee/projects/Onboarding/iceberg
  up_sh:
    - "vendor/postgresql.jar가 없으면 SeaTunnel 이미지에서 복사"
    - "catalog-tools 이미지 빌드: Python + PyIceberg HMS 클라이언트"
    - "source-db·catalog-db·HMS 기동"
    - "prepare_catalog.py로 HMS에 retail namespace 준비: 존재하면 재사용"
  up_trino_sh: "기본 Compose + analytics Compose로 HMS와 Trino 기동"
  up_superset_sh: "환경변수 파일 준비·이미지 빌드·DB 마이그레이션·관리자/권한 준비·웹 기동·기존 orders 차트 등록"
  caveat: "up-superset.sh의 현재 기본 차트 등록/조회 검증은 retail.orders 적재 완료를 전제로 한다. 빈 환경에서는 별도 데이터 적재가 필요하다."
  ingestion: "위 세 스크립트는 1억 행을 적재하지 않는다. load-production-100m.py와 job은 별도 실행 경로이며 현재 적재 완료 상태다."

iceberg_restart:
  preconditions:
    - "Docker Desktop 실행, 기존 이미지·설정·JDBC JAR 준비"
    - "기존 lake/ 파일 및 catalog-db·superset-db 볼륨 보존"
    - ".env.superset 보존, 동일한 Compose 프로젝트 이름 사용"
  base_only: |
    cd /Users/mz01-jaejunlee/projects/Onboarding/iceberg
    docker compose -f compose.yaml up -d
  base_only_result: "기본 source-db·catalog-db·HMS 기동. tools 프로필의 적재/초기화 작업은 제외."
  including_web: |
    cd /Users/mz01-jaejunlee/projects/Onboarding/iceberg
    docker compose -f compose.yaml -f compose.analytics.yaml up -d --wait
  including_web_result: "기본 서비스 + Trino·Superset DB·Superset 기동. 기존 데이터 즉시 조회 가능하며 커스텀 초기화 도구와 적재 job은 재실행하지 않는다."
  check: "docker compose -f compose.yaml -f compose.analytics.yaml ps"
  stop_and_remove: "docker compose -f compose.yaml -f compose.analytics.yaml down"
  login: "python3 scripts/show-superset-login.py"
  web: "http://localhost:8088"
  sql: "SELECT count(*) FROM iceberg.retail.production_orders_100m;"
  expected: "기존 검증 기준 100000000행. 이 안내서 작성 중 서비스나 쿼리를 실행하지 않았다."

